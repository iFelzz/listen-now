version: "3.9"

services:
  melodyxx:
    # Ganti 'image' menjadi 'build: .' agar Portainer merakit sendiri dari Dockerfile
    build: .
    container_name: melodyxx-container
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount folder .git host agar commit hash selalu live dan sinkron dengan Portainer Git
      - ./.git:/app/.git:ro
    # Hapus opsi --reload karena ini sudah masuk fase Production
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      - PYTHONUNBUFFERED=1
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
